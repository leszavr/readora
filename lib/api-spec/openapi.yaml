openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Readora API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: books
    description: Book management
  - name: reader
    description: Reader operations
  - name: genres
    description: Genre management
  - name: admin
    description: Admin panel
  - name: analytics
    description: Private analytics operations
  - name: feedback
    description: Feedback survey operations
  - name: external-storage
    description: External book storage connections
  - name: announcements
    description: Admin announcements and changelog for users

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Login unavailable (maintenance or account pending deletion)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      code:
                        type: string
                        enum: [ACCOUNT_PENDING_DELETION]
                      scheduledFor:
                        type: string
                        format: date-time

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/delete/preview:
    get:
      operationId: getAccountDeletionPreview
      tags: [auth]
      summary: Get a confirmation code for account deletion (GitHub-style)
      description: >-
        Генерирует одноразовый 8-значный код подтверждения удаления,
        который показывается во втором окне диалога и вводится вручную.
        Код действителен 10 минут.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionPreview"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/delete:
    post:
      operationId: deleteAccount
      tags: [auth]
      summary: Schedule the current user account for deletion (grace period)
      description: >-
        Помечает аккаунт на удаление через grace period; фактическая очистка
        выполняется планировщиком. Подтверждение — 8-значный код из preview;
        повторная аутентификация не требуется (действующая сессия достаточна,
        способ авторизации не важен). Все сессии пользователя аннулируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "200":
          description: Account scheduled for deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: Invalid or expired confirmation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account cannot be deleted (admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gift editions in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/settings:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /analytics/events/batch:
    post:
      operationId: submitAnalyticsEventsBatch
      tags: [analytics]
      summary: Submit a private analytics event batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventsBatchInput"
      responses:
        "200":
          description: Accepted and rejected event identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventsBatchResult"
        "204":
          description: Analytics is disabled for the current user
        "400":
          description: Invalid event batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Event batch exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/trusted-devices:
    get:
      operationId: getTrustedDevices
      tags: [auth]
      summary: Get list of trusted devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedDevice"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeAllTrustedDevices
      tags: [auth]
      summary: Revoke all trusted devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/trusted-devices/{id}:
    delete:
      operationId: revokeTrustedDevice
      tags: [auth]
      summary: Revoke a specific trusted device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # GENRES
  /genres:
    get:
      operationId: listGenres
      tags: [genres]
      summary: List all genres
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"
    post:
      operationId: createGenre
      tags: [genres]
      summary: Create genre (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Genre"

  /genres/{id}:
    patch:
      operationId: updateGenre
      tags: [genres]
      summary: Update genre (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Genre"
    delete:
      operationId: deleteGenre
      tags: [genres]
      summary: Delete genre (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CYCLES
  /cycles:
    get:
      operationId: listCycles
      tags: [books]
      summary: List user cycles/series
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
    post:
      operationId: createCycle
      tags: [books]
      summary: Create cycle/series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"

  /books/assign-cycle:
    post:
      operationId: assignBooksToCycle
      tags: [books]
      summary: Bulk assign books to a cycle (or clear assignment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookIds:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  maxItems: 500
                cycleId:
                  type: [integer, "null"]
                cycleName:
                  type: [string, "null"]
                  maxLength: 200
              required: [bookIds]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  cycleId:
                    type: [integer, "null"]
                  cycleName:
                    type: [string, "null"]
                required: [updated]
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cycle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # BOOKS
  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: List user books
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: genreId
          in: query
          schema:
            type: integer
        - name: author
          in: query
          schema:
            type: string
        - name: cycleId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, reading, finished]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [title, author, uploadedAt, lastReadAt, progress]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [author, genre, cycle, status, none]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

  /books/upload:
    post:
      operationId: uploadBook
      tags: [books]
      summary: Upload a book file (FB2 or EPUB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookUploadInput"
      responses:
        "202":
          description: Accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookUploadJob"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File size or library storage limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/storage-quota:
    get:
      operationId: getStorageQuota
      tags: [books]
      summary: Get current user's book storage quota
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookStorageQuota"

  /books/{id}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get book details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBook
      tags: [books]
      summary: Update book metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
    delete:
      operationId: deleteBook
      tags: [books]
      summary: Delete a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /books/delete-bulk:
    post:
      operationId: deleteBulkBooks
      tags: [books]
      summary: Delete multiple books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  # READER
  /books/{id}/chapters:
    get:
      operationId: listChapters
      tags: [reader]
      summary: Get book table of contents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /books/{id}/chapters/{chapterId}:
    get:
      operationId: getChapter
      tags: [reader]
      summary: Get chapter content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: chapterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterContent"

  /books/{id}/progress:
    get:
      operationId: getProgress
      tags: [reader]
      summary: Get reading progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
    put:
      operationId: saveProgress
      tags: [reader]
      summary: Save reading progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"

  /books/{id}/complete:
    post:
      operationId: completeBook
      tags: [reader]
      summary: Mark book as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"

  /books/{id}/reopen:
    post:
      operationId: reopenBook
      tags: [reader]
      summary: Restart reading a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"

  /reader/settings:
    get:
      operationId: getReaderSettings
      tags: [reader]
      summary: Get reader settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"
    put:
      operationId: saveReaderSettings
      tags: [reader]
      summary: Save reader settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"
    delete:
      operationId: resetReaderSettings
      tags: [reader]
      summary: Reset reader settings to defaults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"

  # PUBLIC
  /public/popular-books:
    get:
      operationId: getPopularBooks
      tags: [books]
      summary: Get popular books for home page (public metadata only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicBook"

  /public/landing-book-covers/{id}:
    get:
      operationId: getLandingBookCover
      tags: [books]
      summary: Get a published landing book cover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WebP cover
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Cover is not available

  /public/maintenance-status:
    get:
      operationId: getMaintenanceStatus
      tags: [health]
      summary: Get maintenance mode status (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

  /public/registration-status:
    get:
      operationId: getRegistrationStatus
      tags: [health]
      summary: Get registration availability (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  # ADMIN
  /feedback/survey:
    get:
      operationId: getFeedbackSurveyOptions
      tags: [feedback]
      summary: Public answer options for the feedback survey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSurveyOptions"
    post:
      operationId: submitFeedbackSurvey
      tags: [feedback]
      summary: Submit a feedback survey response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSurveyInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSubmitResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback/survey/eligibility:
    get:
      operationId: getFeedbackSurveyEligibility
      tags: [feedback]
      summary: Check whether the authenticated user should see the feedback survey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSurveyEligibility"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/online-users:
    get:
      operationId: getAdminOnlineUsers
      tags: [admin]
      summary: Currently online users (in-memory presence)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineUsersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Aggregated system analytics (system admins only)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "403":
          description: System administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Unsupported analytics period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/analytics/users:
    get:
      operationId: getAdminAnalyticsUsers
      tags: [admin]
      summary: Per-user analytics detail (system admins only)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalyticsUsers"
        "403":
          description: System administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Unsupported analytics period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/feedback:
    get:
      operationId: getAdminFeedback
      tags: [admin]
      summary: Feedback survey statistics with filters (system admins only)
      parameters:
        - name: days
          in: query
          schema:
            type: string
            enum: [all, "7", "30", "90"]
            default: all
        - name: rating
          in: query
