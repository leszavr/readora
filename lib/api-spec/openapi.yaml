          type: ["string", "null"]
          enum: [not_started, reading, finished, null]
        progressPercent:
          type: ["number", "null"]
        lastReadAt:
          type: ["string", "null"]
          format: date-time
        hideFromPopular:
          type: boolean
        uploadedAt:
          type: string
          format: date-time

    BookUploadInput:
