        status:
          type: string
          enum: [active, blocked]
        cycleId:
          type: ["integer", "null"]
        cycleName:
          type: ["string", "null"]
        cycleNumber:
          type: ["number", "null"]
        fileSize:
          type: integer
        wordCount:
          type: ["integer", "null"]
        chapterCount:
          type: ["integer", "null"]
        genres:
          type: array
          items:
            $ref: "#/components/schemas/Genre"
