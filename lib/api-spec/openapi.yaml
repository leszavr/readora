      operationId: updateAppSettings
      tags: [admin]
      summary: Update app settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /admin/saved-emails:
    get:
      operationId: getSavedEmails
      tags: [admin]
      summary: Get list of saved emails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedEmailSummary"
    delete:
      operationId: clearSavedEmails
      tags: [admin]
      summary: Delete all saved emails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /admin/saved-emails/{id}:
    get:
      operationId: getSavedEmail
      tags: [admin]
      summary: Get saved email by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEmailFull"
        "404":
          description: Not found
    delete:
      operationId: deleteSavedEmail
      tags: [admin]
      summary: Delete saved email by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /external-storage/feature-status:
    get:
      operationId: getExternalStorageFeatureStatus
      tags: [external-storage]
      summary: Check whether external storage feature is enabled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                required: [enabled]

  /external-storage/connections:
    get:
      operationId: listExternalStorageConnections
      tags: [external-storage]
      summary: List user external storage connections
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalStorageConnection"

  /external-storage/connections/mailru:
    post:
      operationId: connectMailRuStorage
      tags: [external-storage]
      summary: Connect Mail.ru Cloud via WebDAV app password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailRuConnectRequest"
      responses:
        "200":
          description: Updated existing connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalStorageConnection"
        "201":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalStorageConnection"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-storage/connections/{id}:
    patch:
      operationId: updateExternalStorageConnection
      tags: [external-storage]
      summary: Update connection root folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalStorageConnectionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalStorageConnection"
        "400":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
    delete:
      operationId: deleteExternalStorageConnection
      tags: [external-storage]
      summary: Disconnect external storage (books and progress are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "404":
          description: Not found

  /external-storage/connections/{id}/folders:
    get:
      operationId: listExternalStorageFolders
      tags: [external-storage]
      summary: List subfolders of a path in external storage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalStorageFolderList"
        "401":
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found

  /external-storage/connections/{id}/sync:
    post:
      operationId: syncExternalStorage
      tags: [external-storage]
      summary: Start synchronization of external storage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Sync job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSyncJob"
        "404":
          description: Not found
        "409":
          description: Sync already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-storage/sync-jobs/{id}:
    get:
      operationId: getExternalSyncJob
      tags: [external-storage]
      summary: Get external storage sync job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSyncJob"
        "404":
          description: Not found
    patch:
      operationId: controlExternalSyncJob
      tags: [external-storage]
      summary: Pause, resume or cancel external storage sync job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [pause, resume, cancel]
              required: [action]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSyncJob"
        "400":
          description: Invalid action
        "404":
          description: Not found
        "409":
          description: Action not applicable to current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-storage/connections/{id}/relocations:
    get:
      operationId: listExternalRelocations
      tags: [external-storage]
      summary: Books that can be moved to the external storage (local duplicates)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalBookRelocationList"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /external-storage/relocations/{id}/resolve:
    post:
      operationId: resolveExternalRelocation
      tags: [external-storage]
      summary: Move a local book to the external storage or dismiss the suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [migrate, dismiss]
              required: [action]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalBookRelocationResolved"
        "400":
          description: Invalid action
        "404":
          description: Not found
        "409":
          description: Already processed or conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-storage/sync-jobs/{id}/failures:
    get:
      operationId: getExternalSyncJobFailures
      tags: [external-storage]
      summary: Failed files details for external storage sync job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSyncJobFailureList"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /admin/external-storage/sync-jobs/{id}:
    patch:
      operationId: adminControlExternalSyncJob
      tags: [admin]
      summary: Control any user's external storage sync job (system admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [pause, resume, cancel]
              required: [action]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum: [queued, processing, paused, cancelled, completed, failed]
                  progress:
                    type: integer
                required: [id, status, progress]
        "400":
          description: Invalid action
        "404":
          description: Not found
        "409":
          description: Action not applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/external-storage/stats:
    get:
      operationId: getAdminExternalStorageStats
      tags: [admin]
      summary: External storage metrics (system admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExternalStorageStats"

  /admin/external-storage/cache/reset:
    post:
      operationId: adminResetExternalStorageCache
      tags: [admin]
      summary: Flush all external books content cache (system admin)
      description: Clears chapter HTML content of all external books; content is re-fetched from owners' clouds on next open.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booksCleared:
                    type: integer
                  bytesFreed:
                    type: integer
                required: [booksCleared, bytesFreed]

components:
  schemas:
    ExternalStorageConnection:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [yandex_disk, mail_ru_cloud]
        providerLabel:
          type: string
        rootFolder:
          type: string
        status:
          type: string
          enum: [active, auth_error, error]
        lastError:
          type: [string, "null"]
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        booksCount:
          type: integer
        missingBooksCount:
          type: integer
        activeSyncJobId:
          type: [integer, "null"]
        activeSyncJobStatus:
          type: [string, "null"]
          enum: [queued, processing, paused, "null"]
      required: [id, provider, providerLabel, rootFolder, status, booksCount, missingBooksCount]

    MailRuConnectRequest:
      type: object
      properties:
        login:
          type: string
          maxLength: 200
        appPassword:
          type: string
          maxLength: 200
        rootFolder:
          type: string
          maxLength: 2000
      required: [login, appPassword]

    ExternalStorageConnectionUpdate:
      type: object
      properties:
        rootFolder:
          type: string
          maxLength: 2000
      required: [rootFolder]

    ExternalStorageFolderList:
      type: object
      properties:
        path:
          type: string
        folders:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
            required: [name, path]
      required: [path, folders]

    ExternalSyncJob:
      type: object
      properties:
        id:
          type: integer
        connectionId:
          type: integer
        status:
          type: string
          enum: [queued, processing, paused, cancelled, completed, failed]
        progress:
          type: integer
        filesFound:
          type: integer
        filesImported:
          type: integer
        filesUpdated:
          type: integer
        filesMissing:
          type: integer
        filesFailed:
          type: integer
        errorMessage:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required: [id, connectionId, status, progress, filesFound, filesImported, filesUpdated, filesMissing, filesFailed]

    ExternalSyncJobFailure:
      type: object
      properties:
        externalPath:
          type: string
        fileName:
          type: string
        reason:
          type: string
          enum: [download, parse, duplicate]
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [externalPath, fileName, reason, errorMessage, createdAt]

    ExternalSyncJobFailureList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalSyncJobFailure"
      required: [items]

    ExternalBookRelocation:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        bookTitle:
          type: string
        bookAuthor:
          type: [string, "null"]
        fileName:
          type: string
        externalPath:
          type: string
        fileSize:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, bookId, bookTitle, fileName, externalPath, fileSize, createdAt]

    ExternalBookRelocationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalBookRelocation"
      required: [items]

    ExternalBookRelocationResolved:
      type: object
      properties:
        id:
          type: integer
        connectionId:
          type: integer
        bookId:
          type: integer
        status:
          type: string
          enum: [migrated, dismissed]
        resolvedAt:
          type: [string, "null"]
          format: date-time
      required: [id, connectionId, bookId, status]

    AdminExternalStorageStats:
      type: object
      properties:
        connections:
          type: object
          properties:
            total:
              type: integer
            byProvider:
              type: array
              items:
                type: object
                properties:
                  provider:
                    type: string
                  count:
                    type: integer
                  users:
                    type: integer
            byStatus:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
        books:
          type: object
          properties:
            externalBooks:
              type: integer
            missingBooks:
              type: integer
        cache:
          type: object
          properties:
            cachedBooks:
              type: integer
            cachedBytes:
              type: integer
            budgetBytes:
              type: integer
        sync:
          type: object
          properties:
            last30Days:
              type: [object, "null"]
              properties:
                total:
                  type: integer
                completed:
                  type: integer
                failed:
                  type: integer
                filesFound:
                  type: integer
                filesImported:
                  type: integer
                filesUpdated:
                  type: integer
                filesMissing:
                  type: integer
                filesFailed:
                  type: integer
            recentJobs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  provider:
                    type: string
                  ownerUsername:
                    type: [string, "null"]
                  status:
                    type: string
                  filesFound:
                    type: integer
                  filesImported:
                    type: integer
                  filesUpdated:
                    type: integer
                  filesMissing:
                    type: integer
                  filesFailed:
                    type: integer
                  errorMessage:
                    type: [string, "null"]
                  createdAt:
                    type: string
                    format: date-time
                  completedAt:
                    type: [string, "null"]
                    format: date-time

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    FeedbackSurveyOptions:
      type: object
      required: [painPoints, missingFeatureTrigger, maxPainPoints]
      properties:
        painPoints:
          type: array
          items:
            type: string
        missingFeatureTrigger:
          type: string
        maxPainPoints:
          type: integer

    FeedbackSurveyInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        painPoints:
          type: array
          maxItems: 2
          items:
            type: string
        missingFeature:
          type: string
          maxLength: 500
        wantsContact:
          type: boolean
        contactInfo:
          type: string
          maxLength: 200
        pageUrl:
          type: string
          maxLength: 500

    FeedbackSubmitResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    FeedbackSurveyEligibility:
      type: object
      required: [shouldShow]
      properties:
        shouldShow:
          type: boolean

    FeedbackPainPointCount:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer

    FeedbackRatingCount:
      type: object
      required: [rating, count]
      properties:
        rating:
          type: integer
        count:
          type: integer

    FeedbackTrendPoint:
      type: object
      required: [day, count, averageRating]
      properties:
        day:
          type: string
        count:
          type: integer
        averageRating:
          type: number

    FeedbackItemUser:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]

    FeedbackItem:
      type: object
      required: [id, rating, painPoints, wantsContact, createdAt]
      properties:
        id:
          type: integer
        rating:
          type: integer
        painPoints:
          type: array
          items:
            type: string
        missingFeature:
          type: ["string", "null"]
        wantsContact:
          type: boolean
        contactInfo:
          type: ["string", "null"]
        pageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        user:
          oneOf:
            - $ref: "#/components/schemas/FeedbackItemUser"
            - type: "null"

    FeedbackSummary:
      type: object
      required: [total, averageRating, lowRatings, contactRequests, contactRate, distribution, topPainPoints, trend]
      properties:
        total:
          type: integer
        averageRating:
          type: number
        lowRatings:
          type: integer
        contactRequests:
          type: integer
        contactRate:
          type: number
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackRatingCount"
        topPainPoints:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackPainPointCount"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackTrendPoint"

    FeedbackFiltersState:
      type: object
      required: [days, rating, painPoint, painPointOptions]
      properties:
        days:
          type: string
        rating:
          type: string
        painPoint:
          type: string
        painPointOptions:
          type: array
          items:
            type: string

    FeedbackStatsResponse:
      type: object
      required: [filters, summary, items]
      properties:
        filters:
          $ref: "#/components/schemas/FeedbackFiltersState"
        summary:
          $ref: "#/components/schemas/FeedbackSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackItem"

    FeedbackDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        kind:
          type: string
          enum: [announcement, release]
          default: announcement
        severity:
          type: string
          enum: [info, warning]
          default: info
        color:
          type: string
          enum: [yellow, green, blue, pink, purple]
          default: blue
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000

    AnnouncementBulkDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer

    AnnouncementDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    AnnouncementReadersResult:
      type: object
      required: [readers]
      properties:
        readers:
          type: integer

    BookDuplicateCandidate:
      type: object
      required: [id, title, author, uploadedAt, hasProgress, progressPercent, readingStatus, lastReadAt, bookmarkCount, noteCount]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time
        hasProgress:
          type: boolean
        progressPercent:
          type: ["number", "null"]
        readingStatus:
          type: ["string", "null"]
          enum: [not_started, reading, finished, null]
        lastReadAt:
          type: ["string", "null"]
          format: date-time
        bookmarkCount:
          type: integer
        noteCount:
          type: integer

    BookDuplicateGroup:
      type: object
      required: [ownerId, ownerUsername, fileHash, title, author, keepId, candidates]
      properties:
        ownerId:
          type: integer
        ownerUsername:
          type: ["string", "null"]
        fileHash:
          type: string
        title:
          type: string
        author:
          type: ["string", "null"]
        keepId:
          type: integer
          description: Книга, которую рекомендуется оставить (самая актуальная)
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/BookDuplicateCandidate"

    BookDuplicatesResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/BookDuplicateGroup"

    BookDeduplicateInput:
      type: object
      required: [keepId, removeIds]
      properties:
        keepId:
          type: integer
        removeIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer

    BookDeduplicateResult:
      type: object
      required: [keptBookId, removedBookIds]
      properties:
        keptBookId:
          type: integer
        removedBookIds:
          type: array
          items:
            type: integer

    AnnouncementItem:
      type: object
      required: [id, kind, severity, color, title, body, publishedAt, readAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [announcement, release]
        severity:
          type: string
          enum: [info, warning]
        color:
          type: string
          enum: [yellow, green, blue, pink, purple]
        title:
          type: string
        body:
          type: string
        publishedAt:
          type: string
          format: date-time
        readAt:
          type: ["string", "null"]
          format: date-time

    ChangelogItem:
      type: object
      required: [id, severity, color, title, body, publishedAt]
      properties:
        id:
          type: integer
        severity:
          type: string
          enum: [info, warning]
        color:
          type: string
          enum: [yellow, green, blue, pink, purple]
        title:
          type: string
        body:
          type: string
        publishedAt:
          type: string
          format: date-time

    ChangelogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogItem"

    AnnouncementsResponse:
      type: object
      required: [unreadCount, items]
      properties:
        unreadCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementItem"

    OnlineUser:
      type: object
      required: [id, username, role, lastSeenAt]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
