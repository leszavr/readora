openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Readora API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: books
    description: Book management
  - name: reader
    description: Reader operations
  - name: genres
    description: Genre management
  - name: admin
    description: Admin panel
  - name: analytics
    description: Private analytics operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registration is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Login is unavailable during maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/delete:
    post:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the current user account and its data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "204":
          description: Account deleted
        "400":
          description: Invalid confirmation or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/settings:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /analytics/events/batch:
    post:
      operationId: submitAnalyticsEventsBatch
      tags: [analytics]
      summary: Submit a private analytics event batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventsBatchInput"
      responses:
        "200":
          description: Accepted and rejected event identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventsBatchResult"
        "204":
          description: Analytics is disabled for the current user
        "400":
          description: Invalid event batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Event batch exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/trusted-devices:
    get:
      operationId: getTrustedDevices
      tags: [auth]
      summary: Get list of trusted devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedDevice"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: revokeAllTrustedDevices
      tags: [auth]
      summary: Revoke all trusted devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/trusted-devices/{id}:
    delete:
      operationId: revokeTrustedDevice
      tags: [auth]
      summary: Revoke a specific trusted device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # GENRES
  /genres:
    get:
      operationId: listGenres
      tags: [genres]
      summary: List all genres
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"
    post:
      operationId: createGenre
      tags: [genres]
      summary: Create genre (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Genre"

  /genres/{id}:
    patch:
      operationId: updateGenre
      tags: [genres]
      summary: Update genre (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Genre"
    delete:
      operationId: deleteGenre
      tags: [genres]
      summary: Delete genre (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CYCLES
  /cycles:
    get:
      operationId: listCycles
      tags: [books]
      summary: List user cycles/series
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
    post:
      operationId: createCycle
      tags: [books]
      summary: Create cycle/series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"

  # BOOKS
  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: List user books
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: genreId
          in: query
          schema:
            type: integer
        - name: author
          in: query
          schema:
            type: string
        - name: cycleId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, reading, finished]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [title, author, uploadedAt, lastReadAt, progress]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [author, genre, cycle, status, none]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

  /books/upload:
    post:
      operationId: uploadBook
      tags: [books]
      summary: Upload a book file (FB2 or EPUB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BookUploadInput"
      responses:
        "202":
          description: Accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookUploadJob"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File size or library storage limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/storage-quota:
    get:
      operationId: getStorageQuota
      tags: [books]
      summary: Get current user's book storage quota
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookStorageQuota"

  /books/{id}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get book details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBook
      tags: [books]
      summary: Update book metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
    delete:
      operationId: deleteBook
      tags: [books]
      summary: Delete a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /books/delete-bulk:
    post:
      operationId: deleteBulkBooks
      tags: [books]
      summary: Delete multiple books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  # READER
  /books/{id}/chapters:
    get:
      operationId: listChapters
      tags: [reader]
      summary: Get book table of contents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  /books/{id}/chapters/{chapterId}:
    get:
      operationId: getChapter
      tags: [reader]
      summary: Get chapter content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: chapterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterContent"

  /books/{id}/progress:
    get:
      operationId: getProgress
      tags: [reader]
      summary: Get reading progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
    put:
      operationId: saveProgress
      tags: [reader]
      summary: Save reading progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"

  /reader/settings:
    get:
      operationId: getReaderSettings
      tags: [reader]
      summary: Get reader settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"
    put:
      operationId: saveReaderSettings
      tags: [reader]
      summary: Save reader settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"
    delete:
      operationId: resetReaderSettings
      tags: [reader]
      summary: Reset reader settings to defaults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"

  # PUBLIC
  /public/popular-books:
    get:
      operationId: getPopularBooks
      tags: [books]
      summary: Get popular books for home page (public metadata only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicBook"

  /public/landing-book-covers/{id}:
    get:
      operationId: getLandingBookCover
      tags: [books]
      summary: Get a published landing book cover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WebP cover
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Cover is not available

  /public/maintenance-status:
    get:
      operationId: getMaintenanceStatus
      tags: [health]
      summary: Get maintenance mode status (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

  /public/registration-status:
    get:
      operationId: getRegistrationStatus
      tags: [health]
      summary: Get registration availability (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  # ADMIN
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Aggregated system analytics (system admins only)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"
        "403":
          description: System administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Unsupported analytics period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/users/{id}/toggle-block:
    post:
      operationId: toggleBlockUser
      tags: [admin]
      summary: Block/unblock user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/verify-email:
    post:
      operationId: verifyUserEmail
      tags: [admin]
      summary: Force verify user email (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/books:
    get:
      operationId: listAdminBooks
      tags: [admin]
      summary: List all books (admin)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBook"

  /admin/books/{id}:
    get:
      operationId: getAdminBook
      tags: [admin]
      summary: Get book details (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBook"
    delete:
      operationId: deleteAdminBook
      tags: [admin]
      summary: Delete book (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/books/delete-bulk:
    post:
      operationId: deleteBulkAdminBooks
      tags: [admin]
      summary: Delete multiple books (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  /admin/books/{id}/toggle-block:
    post:
      operationId: toggleBlockBook
      tags: [admin]
      summary: Block/unblock book (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBook"

  /admin/landing-books:
    get:
      operationId: listLandingBooks
      tags: [admin]
      summary: List landing books (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandingBook"
    post:
      operationId: createLandingBook
      tags: [admin]
      summary: Extract metadata from a book file and create a landing book (admin)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LandingBookUploadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingBook"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/landing-books/{id}:
    patch:
      operationId: updateLandingBook
      tags: [admin]
      summary: Update landing book metadata and publication state (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandingBookUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingBook"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLandingBook
      tags: [admin]
      summary: Delete a landing book (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/landing-books/{id}/cover:
    get:
      operationId: getAdminLandingBookCover
      tags: [admin]
      summary: Get a landing book cover (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WebP cover
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
    post:
      operationId: updateLandingBookCover
      tags: [admin]
      summary: Replace a landing book cover (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LandingBookCoverUploadInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingBook"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/settings:
    get:
      operationId: getAppSettings
      tags: [admin]
      summary: Get app settings (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateAppSettings
      tags: [admin]
      summary: Update app settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /admin/saved-emails:
    get:
      operationId: getSavedEmails
      tags: [admin]
      summary: Get list of saved emails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedEmailSummary"
    delete:
      operationId: clearSavedEmails
      tags: [admin]
      summary: Delete all saved emails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /admin/saved-emails/{id}:
    get:
      operationId: getSavedEmail
      tags: [admin]
      summary: Get saved email by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEmailFull"
        "404":
          description: Not found
    delete:
      operationId: deleteSavedEmail
      tags: [admin]
      summary: Delete saved email by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # AUTH SCHEMAS
    RegisterInput:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        username:
          type: string
          minLength: 2
        referralSource:
          type: string
          enum: [direct, telegram, habr, productradar, show_hn, reddit, vk, seo, other]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
          default: false

    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string

    ProfileUpdate:
      type: object
      properties:
        username:
          type: string
        avatar:
          type: ["string", "null"]
        analyticsOptIn:
          type: boolean

    User:
      type: object
      required: [id, email, username, role, status, analyticsOptIn, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        status:
          type: string
          enum: [active, blocked]
        avatar:
          type: ["string", "null"]
        analyticsOptIn:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: ["string", "null"]
          format: date-time

    AnalyticsEventsBatchInput:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AnalyticsClientEvent"

    AnalyticsClientEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventName, occurredAt, localDate, clientId, platform, deviceMode, properties]
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
          enum: [app_opened, library_viewed, book_upload_started, reader_session_started, reader_session_ended, reading_progressed, chapter_opened, progress_sync_finished]
        occurredAt:
          type: string
          format: date-time
        localDate:
          type: string
          format: date
        sessionId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [web]
        deviceMode:
          type: string
          enum: [desktop, mobile, unknown]
        appVersion:
          type: string
          maxLength: 64
        bookId:
          type: integer
        properties:
          type: object

    AnalyticsEventsBatchResult:
      type: object
      required: [acceptedEventIds, rejectedEventIds]
      properties:
        acceptedEventIds:
          type: array
          items:
            type: string
            format: uuid
        rejectedEventIds:
          type: array
          items:
            type: string
            format: uuid

    TrustedDevice:
      type: object
      required: [id, deviceInfo, createdAt, lastUsedAt, expiresAt]
      properties:
        id:
          type: integer
        deviceInfo:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    # GENRES
    Genre:
      type: object
      required: [id, code, name, isActive]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean

    GenreInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string

    GenreUpdate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean

    # CYCLES
    Cycle:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CycleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    # BOOKS
    Book:
      type: object
      required: [id, title, format, status, uploadedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        format:
          type: string
          enum: [fb2, epub]
        language:
